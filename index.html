<style>
/* ── Tokens ──────────────────────────────────────────────────── */
:root{
  color-scheme: light;

  --forest:   #5C1424;   /* deep botanical green */
  --moss:     #7A2A3B;   /* mid green */
  --sage:     #A98089;   /* soft green */
  --sage-pale:#E8D6D2;

  --beige:    #E3D3BA;   /* warm beige */
  --beige-lo: #EDE2CE;
  --cream:    #F3EBDD;   /* off-white */
  --cream-hi: #F8F2E8;

  --gold:     #C5A46D;
  --gold-deep:#94753F;

  --deep:   #55131F;   /* section greens — never overridden */
  --deep-2: #430E18;
  --deep-3: #2E0A11;

  --ink:      #33252A;
  --ink-soft: #6B565B;

  --display: "Cormorant Garamond", "Cormorant", "EB Garamond", Garamond, "Hoefler Text", Baskerville, Georgia, serif;
  --sans: "Cormorant Garamond", "Cormorant", "EB Garamond", Garamond, "Hoefler Text", Baskerville, Georgia, serif;
  --script: "Italianno", "Snell Roundhand", "Apple Chancery", "Segoe Script", "Brush Script MT", cursive;
  --quran: "Amiri", "Amiri Quran", "Traditional Arabic", serif;

  --gutter: clamp(1.35rem, 5vw, 3rem);
  --rhythm: clamp(4.5rem, 11vw, 8.5rem);

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{ box-sizing: inherit; }
html{ scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; -webkit-text-size-adjust:100%; }

body{
  margin:0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 500;
  font-size: clamp(1.1rem, 0.45vw + 1rem, 1.22rem);
  line-height: 1.8;
  letter-spacing: .005em;
  text-align: center;
  overflow-x: hidden;
}
body.locked{ overflow: hidden; height: 100%; }

img{ max-width:100%; display:block; }
button{ font: inherit; color: inherit; cursor: pointer; }
a{ color: var(--moss); }
:focus-visible{ outline: 2px solid var(--gold); outline-offset: 4px; }

h1,h2,h3{ font-weight: 500; margin: 0; line-height: 1.2; }
p{ margin: 0 0 1.1em; }

.decor{ position:absolute; pointer-events:none; color: var(--sage); }

/* Burgundy sections re-point the same tokens, so every component inverts cleanly */
.dark{
  background: var(--deep);
  color: #F3EBDD;
  --ink:       #F3EBDD;
  --ink-soft:  #D9C3BE;
  --forest:    #F3EBDD;
  --moss:      #D9BC85;
  --gold:      #D4B67E;
  --gold-deep: #D4B67E;
  --cream:     #430E18;
  --sage:      #B58C93;
}
.dark .decor{ opacity: .2; }

/* ── Envelope ────────────────────────────────────────────────── */
#overlay{
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center;
  background:
    radial-gradient(120% 90% at 50% 18%, #FAF5EC 0%, var(--cream) 48%, #E4D6BE 100%);
  padding: calc(1.5rem + env(safe-area-inset-top,0px)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom,0px));
  transition: opacity 1.4s ease, visibility 1.4s;
  overflow: hidden;
}
#overlay.gone{ opacity: 0; visibility: hidden; pointer-events: none; }
#overlay .decor{ color: var(--forest); opacity:.09; }
#overlay .d-a{ top:-4rem; left:-5rem; width: min(24rem, 58vw); rotate: 14deg; }
#overlay .d-b{ bottom:-5rem; right:-5rem; width: min(26rem, 62vw); rotate: -160deg; }

.env-stage{ display: grid; justify-items: center; gap: clamp(1.3rem, 4vw, 2.2rem); position: relative; z-index:1; }

.env-eyebrow{
  font-family: var(--display);
  font-size: clamp(2.4rem, 9vw, 4rem);
  color: var(--forest); line-height: 1;
  letter-spacing: .04em;
  opacity: 0; animation: riseIn 1.2s .25s ease forwards;
}
.env-to{
  font-size: .78rem; letter-spacing: .18em; color: var(--ink-soft); font-weight:400;
  opacity: 0; animation: riseIn 1.2s .45s ease forwards;
}

.envelope{
  position: relative;
  width: min(86vw, 27rem);
  aspect-ratio: 1.55 / 1;
  perspective: 1400px;
  background: none; border: 0; padding: 0;
  opacity: 0; animation: riseIn 1.3s .6s ease forwards;
}
.env-body{ position: absolute; inset: 0; transform-style: preserve-3d; }

.env-back{
  position:absolute; inset:0; border-radius: 3px;
  background: linear-gradient(160deg,#6B1D2C,#55131F 55%,#3F0E19);
  box-shadow: 0 34px 60px -26px rgba(51,37,42,.7), 0 10px 22px -12px rgba(51,37,42,.5);
}
.env-card{
  position: absolute; left: 6%; right: 6%; top: 7%; bottom: 10%;
  background: var(--crn-tl) top 6px left 6px/26px no-repeat, var(--crn-tr) top 6px right 6px/26px no-repeat, var(--crn-bl) bottom 6px left 6px/26px no-repeat, var(--crn-br) bottom 6px right 6px/26px no-repeat, var(--pat), linear-gradient(175deg,#FAF5EB,var(--cream));
  border: 1px solid rgba(197,164,109,.8);
  box-shadow: inset 0 0 0 5px #FAF5EB, inset 0 0 0 6px rgba(197,164,109,.55), 0 -2px 10px rgba(51,37,42,.2);
  display: grid; place-content: center; gap: .5rem;
  transition: transform 1.7s cubic-bezier(.3,.7,.2,1);
  z-index: 1;
}
.env-card::before{ content:""; position:absolute; top:9%; left:50%; width:2.6rem; height:1.3rem; translate:-50% 0; background: var(--crown) center/contain no-repeat; }
.env-card::after{ content:""; position:absolute; bottom:9%; left:50%; width:5rem; height:1rem; translate:-50% 0; background: var(--flour) center/contain no-repeat; }
.env-card span{ font-family: var(--display); font-size: clamp(1.7rem,5.6vw,2.4rem); color: var(--forest); letter-spacing:.05em; }
.env-card small{ font-size: .62rem; letter-spacing: .34em; color: var(--gold-deep); }

.env-front{
  position:absolute; inset:0; z-index:2; border-radius:3px;
  background: var(--pat-env), linear-gradient(90deg,#3E0F1A 0%,#5C1827 30%,#5C1827 70%,#3E0F1A 100%);
  clip-path: polygon(0 0, 50% 44%, 100% 0, 100% 100%, 0 100%);
}
.env-front::before{
  content:""; position:absolute; inset:0;
  background: var(--pat-env), linear-gradient(0deg,#4A121E,#68202F 80%);
  clip-path: polygon(0 100%, 50% 47%, 100% 100%);
}
.env-front::after{
  content:""; position:absolute; inset:0;
  background: linear-gradient(90deg,#B8964F,#EAD6A0,#B8964F);
  clip-path: polygon(0 100%, 50% 47%, 100% 100%, 98.4% 100%, 50% 49%, 1.6% 100%);
}
.env-flap{
  position:absolute; left:0; right:0; top:0; height: 46%; z-index: 4;
  background: var(--pat-env), linear-gradient(185deg,#6D2030,#55131F 70%,#45111C);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  transition: transform 1.5s cubic-bezier(.6,.02,.3,1), z-index 0s 1.5s;
}
.env-flap::after{ content:""; position:absolute; inset:0; background: linear-gradient(90deg,#B8964F,#EAD6A0,#B8964F); clip-path: polygon(0 0, 2.2% 0, 50% 95%, 97.8% 0, 100% 0, 50% 100%); }
.env-shadowline{
  position:absolute; inset:0; z-index:3; pointer-events:none;
  background: linear-gradient(180deg, rgba(30,10,18,.38), transparent 46%);
  clip-path: polygon(0 0, 50% 44%, 100% 0, 100% 46%, 0 46%);
  transition: opacity .6s;
}

.seal{
  position: absolute; z-index: 6;
  left: 50%; top: 44%; translate: -50% -50%;
  width: clamp(3.6rem, 14vw, 4.8rem); aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #EBD6A3, #C5A46D 52%, #9A7B43);
  box-shadow: 0 8px 16px rgba(30,10,18,.5), 0 2px 3px rgba(30,10,18,.4), inset 0 -3px 7px rgba(90,64,24,.45), inset 0 2px 3px rgba(255,244,214,.6);
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 600; color: #55131F;
  font-size: clamp(1.1rem,4.2vw,1.45rem); letter-spacing: .1em;
  transition: transform .6s ease, opacity .5s ease;
  animation: sealGlow 3.4s 2.2s ease-in-out infinite;
}
.seal::after{
  content:""; position:absolute; inset:9%; border-radius:50%;
  border: 1px solid rgba(85,19,31,.45);
}

.env-hint{
  font-size: .7rem; letter-spacing: .32em; text-transform: uppercase; font-weight:500;
  color: var(--gold-deep);
  opacity: 0; animation: riseIn 1.2s 1.1s ease forwards, breathe 3.4s 2.4s ease-in-out infinite;
}

.envelope.opening .seal{ transform: scale(1.2) rotate(-12deg); opacity: 0; animation: none; }
.envelope.opening .env-flap{ transform: rotateX(-172deg); z-index: 0; }
.envelope.opening .env-shadowline{ opacity: 0; }
.envelope.lift .env-card{ transform: translateY(-64%) scale(1.05); }
.envelope.bloom{ animation: bloom 1.5s ease-in forwards; }

@keyframes bloom{ to{ transform: translateY(6%) scale(1.12); opacity: 0; filter: blur(5px); } }
@keyframes riseIn{ from{ opacity:0; transform: translateY(18px); } to{ opacity:1; transform:none; } }
@keyframes breathe{ 0%,100%{ opacity:.55 } 50%{ opacity:1 } }

/* ── Particles ───────────────────────────────────────────────── */
#dust{ position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .6; }

/* ── Layout ──────────────────────────────────────────────────── */
main{ position: relative; z-index: 1; }
.wrap{ width: min(100% - var(--gutter)*2, 62rem); margin-inline: auto; position: relative; z-index:1; }
.narrow{ max-width: 34rem; margin-inline: auto; }
section{ padding-block: var(--rhythm); position: relative; overflow: hidden; }

.reveal{ opacity: 0; transform: translateY(26px); transition: opacity 1s ease, transform 1s cubic-bezier(.22,.9,.28,1); }
.reveal.in{ opacity: 1; transform: none; }

.kicker{
  color: var(--ink-soft); font-size: .78rem;
  letter-spacing: .24em; text-transform: uppercase; margin-bottom: 1rem;
}
.h-script{ font-family: var(--display); color: var(--forest); font-size: clamp(2.2rem, 7vw, 3.2rem); line-height: 1.12; letter-spacing:.03em; }
.h-serif{ font-family: var(--display); font-size: clamp(1.9rem, 5vw, 2.5rem); letter-spacing: .06em; color: var(--forest); }

.sprig{ display:block; margin: 1.6rem auto; width: clamp(8rem, 24vw, 11rem); color: var(--gold); opacity: .9; }

/* ── Hero ────────────────────────────────────────────────────── */
.hero{
  min-height: 100svh;
  display: grid; align-content: center; gap: .4rem;
  padding-block: calc(var(--rhythm) * .8);
  background:
    radial-gradient(95% 62% at 50% 4%, rgba(197,164,109,.16), transparent 64%),
    linear-gradient(180deg, #611827, var(--deep) 52%, var(--deep-2));
}
.hero-corner{ position:absolute; width: clamp(9rem,28vw,17rem); color: #D4B67E; opacity:.34; pointer-events:none; }
.hero-corner.tl{ top: 0; left: -2rem; }
.hero-corner.br{ bottom: 0; right: -2rem; rotate: 180deg; }

.hero-arch{
  position:absolute; left:50%; top:50%; translate:-50% -50%;
  width: min(80vw, 28rem); aspect-ratio: .68; pointer-events:none;
  border: 1px solid rgba(212,182,126,.55);
  border-radius: 999px 999px 0 0;
}
.hero-arch::after{
  content:""; position:absolute; inset: .9rem;
  border: 1px solid rgba(212,182,126,.28);
  border-radius: 999px 999px 0 0;
}

.names{
  font-family: var(--display);
  font-size: clamp(2.9rem, 13vw, 6.2rem);
  line-height: 1.04; color: var(--forest);
  letter-spacing: .015em;
  margin: .5rem 0 .2rem;
}
.amp{ display:block; font-size: .5em; font-style: italic; color: var(--gold); margin: .02em 0 .08em; letter-spacing:0; line-height:1; }
.hero-date{
  font-size: clamp(.72rem,2.4vw,.84rem); letter-spacing: .38em;
  color: var(--moss); margin-top: 1.6rem; font-weight: 400;
}
.scroll-cue{
  position:absolute; bottom: calc(1.6rem + env(safe-area-inset-bottom,0px)); left:50%; translate:-50% 0;
  font-size:.62rem; letter-spacing:.3em; color: var(--ink-soft); text-transform: uppercase;
}
.scroll-cue::after{ content:""; display:block; width:1px; height:2.6rem; margin:.7rem auto 0; background: linear-gradient(var(--gold), transparent); }

/* ── Invitation ──────────────────────────────────────────────── */
.invite .d-leafL{ top: 12%; left: -3.5rem; width: clamp(9rem,24vw,14rem); opacity:.16; rotate:-8deg; }
.invite .d-leafR{ bottom: 8%; right: -3.5rem; width: clamp(9rem,24vw,14rem); opacity:.16; rotate:172deg; }

.verse{
  position: relative; margin-top: 2.8rem; padding: 2.4rem 1.4rem 2rem;
  background: linear-gradient(180deg, #EDE2CE, #F3EBDD);
  border: 1px solid rgba(197,164,109,.55);
  box-shadow: inset 0 0 0 5px var(--cream), inset 0 0 0 6px rgba(197,164,109,.3);
}
.verse::before, .verse::after{
  content:""; position:absolute; left:50%; width:10px; height:10px; translate:-50% 0; rotate:45deg;
  background: var(--cream); border: 1px solid var(--gold);
}
.verse::before{ top:-6px; }
.verse::after{ bottom:-6px; }
.verse #verseText{
  display: block; direction: rtl; unicode-bidi: isolate;
  font-family: var(--quran); font-style: normal; font-weight: 400;
  font-size: clamp(1.45rem, 1.2vw + 1.1rem, 1.85rem);
  line-height: 2.2; color: var(--forest);
}
.verse cite{ display:block; font-style: normal; direction: rtl; unicode-bidi: isolate; font-family: var(--quran); font-size: 1.05rem; color: var(--gold-deep); }
.verse cite::before{ content:""; display:block; width:2.4rem; height:1px; background: var(--gold); margin: 1rem auto .8rem; }

/* ── Details ─────────────────────────────────────────────────── */
.details{
  background: linear-gradient(180deg, var(--deep-2), var(--deep));
}
.details .d-wave{ top: 0; left:50%; translate:-50% 0; width: min(120%, 70rem); opacity:.35; color: var(--gold); }
.detail-grid{
  display: grid; gap: clamp(2.2rem, 5vw, 3rem);
  grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
  margin-top: 2.6rem;
}
.detail-grid > div + div{ border-left: 1px solid rgba(212,182,126,.3); }
@media (max-width: 43rem){
  .detail-grid > div + div{ border-left: 0; border-top: 1px solid rgba(212,182,126,.3); padding-top: clamp(2.2rem,5vw,3rem); }
}
.detail-label{ font-size:.66rem; letter-spacing:.3em; color: var(--gold-deep); text-transform: uppercase; }
.detail-main{ font-family: var(--display); font-size: clamp(1.5rem, 4vw, 2rem); margin: .7rem 0 .3rem; color: var(--forest); letter-spacing:.03em; }
.detail-sub{ color: var(--ink-soft); font-size: .92rem; }
.hijri{ display:block; color: var(--moss); font-size: .86rem; margin-top:.4rem; }

.btn{
  display:inline-block; text-decoration:none;
  border: 1px solid var(--moss); background: transparent;
  color: var(--moss);
  padding: .85rem 2rem; font-size:.7rem; letter-spacing:.24em; text-transform: uppercase; font-weight:400;
  transition: background .4s ease, color .4s ease, border-color .4s ease;
}
.btn:hover{ background: var(--forest); border-color: var(--forest); color: var(--cream); }
.btn-solid{ background: var(--forest); border-color: var(--forest); color: var(--cream); }
.btn-solid:hover{ background: var(--moss); border-color: var(--moss); }
.btn-row{ display:flex; flex-wrap:wrap; gap:.8rem; justify-content:center; margin-top: 2.2rem; }

/* ── Countdown ───────────────────────────────────────────────── */
.cd-section{ background: linear-gradient(180deg, var(--deep), var(--deep-3)); }
.cd-section .d-arc{ top:50%; left:50%; translate:-50% -50%; width: min(90%, 40rem); opacity:.22; color: var(--gold); }
.cd-section .d-sprig{ top: 1.6rem; left: 50%; translate: -50% 0; width: 7rem; opacity:.5; color: var(--gold); }
.count{ display:flex; justify-content:center; flex-wrap:wrap; gap: clamp(1rem,5vw,3rem); margin-top:2.4rem; }
.count div{ min-width: 4.2rem; }
.count b{
  display:block; font-family: var(--display); font-weight:400;
  font-size: clamp(2.6rem,10vw,4rem); line-height:1; color: var(--ink);
  font-variant-numeric: tabular-nums; letter-spacing:.02em;
}
.count span{ font-size:.62rem; letter-spacing:.28em; text-transform:uppercase; color: var(--ink-soft); }
.dayof{ font-family: var(--display); font-size: clamp(2.2rem,8vw,3.4rem); color: var(--gold); letter-spacing:.04em; }

/* ── Story ───────────────────────────────────────────────────── */
.story .d-vine{ top: 14%; right: -2rem; width: clamp(8rem,20vw,12rem); opacity:.18; rotate: 8deg; }
.timeline{ position: relative; margin-top: 3rem; text-align: left; }
.timeline::before{
  content:""; position:absolute; left: 0; top: .4rem; bottom: .4rem; width:1px;
  background: linear-gradient(transparent, var(--sage) 12%, var(--sage) 88%, transparent);
}
.tl-item{ position: relative; padding: 0 0 2.8rem 2rem; }
.tl-item:last-child{ padding-bottom: 0; }
.tl-item::before{
  content:""; position:absolute; left:-4px; top:.85rem; width:9px; height:9px; rotate:45deg;
  background: var(--cream); border:1px solid var(--gold);
}
.tl-when{ font-size:.66rem; letter-spacing:.26em; text-transform:uppercase; color: var(--gold-deep); }
.tl-title{ font-family: var(--display); font-size:1.5rem; margin:.4rem 0 .4rem; color: var(--forest); letter-spacing:.03em; }
.tl-item p{ color: var(--ink-soft); margin:0; }

/* ── Gallery ─────────────────────────────────────────────────── */
.gallery-sec{ background: linear-gradient(180deg, var(--deep-2), var(--deep)); }
.gallery{ display:grid; gap:.7rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); margin-top:2.6rem; }
.gallery button{ border:0; padding:0; background:none; overflow:hidden; position:relative; aspect-ratio: 3/4; }
.gallery img{ width:100%; height:100%; object-fit: cover; transition: transform 1.1s cubic-bezier(.22,.9,.28,1); }
.gallery button:hover img{ transform: scale(1.05); }
.gallery figcaption{
  position:absolute; inset:auto 0 0 0; padding:.85rem;
  font-size:.7rem; letter-spacing:.16em; color: #F4F1E8;
  background: linear-gradient(transparent, rgba(18,28,22,.8));
  opacity:0; transition: opacity .45s;
}
.gallery button:hover figcaption, .gallery button:focus-visible figcaption{ opacity:1; }

#lightbox{
  position: fixed; inset:0; z-index: 90; display:none; place-items:center;
  background: rgba(24,35,28,.95); padding: 3.2rem 1rem;
}
#lightbox.on{ display:grid; }
#lightbox img{ max-height: 78svh; max-width: 100%; object-fit: contain; }
#lightbox .lb-cap{ color: var(--beige); margin-top:1rem; font-size:.9rem; letter-spacing:.06em; }
#lightbox button{
  position:absolute; background:none; border:0; color: var(--beige); font-size:1.9rem; line-height:1; padding:.6rem 1rem;
}
.lb-prev{ left:.2rem; top:50%; translate:0 -50%; }
.lb-next{ right:.2rem; top:50%; translate:0 -50%; }
.lb-close{ top: calc(.6rem + env(safe-area-inset-top,0px)); right:.4rem; font-size:.72rem !important; letter-spacing:.24em; text-transform:uppercase; }

/* ── Venue ───────────────────────────────────────────────────── */
.venue{ background: linear-gradient(180deg, var(--cream-hi), var(--cream)); }
.venue .d-ring{ bottom:-6rem; left:-5rem; width: min(26rem,60vw); opacity:.2; color: var(--moss); }
.map-card{
  margin-top: 2.4rem; padding: clamp(2.2rem,6vw,3.6rem) 1.5rem;
  border: 1px solid rgba(191,160,106,.45);
  position: relative; overflow: hidden;
  background:
    radial-gradient(60% 50% at 50% 0%, rgba(140,163,145,.16), transparent 70%),
    linear-gradient(160deg, var(--cream-hi), #F2EEE3);
}
.map-card .d-corner{ top:-1.5rem; right:-1.5rem; width: 8rem; opacity:.22; rotate: 90deg; color: var(--moss); }
.venue-name{ font-family: var(--display); font-size: clamp(1.7rem,5vw,2.3rem); color: var(--forest); letter-spacing:.04em; margin:0; }
.venue-addr{ color: var(--ink-soft); margin:.7rem 0 0; }
.venue-note{ color: var(--gold-deep); font-size:.86rem; margin-top:1rem; letter-spacing:.04em; }

/* ── Dress code ──────────────────────────────────────────────── */
.dress{ background: linear-gradient(180deg, var(--deep), var(--deep-2)); }
.dress .d-leafL{ bottom: 6%; left: -3rem; width: clamp(8rem,22vw,12rem); opacity:.16; rotate: 24deg; }
.swatches{ display:flex; justify-content:center; gap:.9rem; margin-top:1.9rem; }
.swatches i{ width: 2.6rem; height:2.6rem; border-radius:50%; display:block; box-shadow: inset 0 0 0 1px rgba(43,62,51,.12); }

/* ── RSVP ────────────────────────────────────────────────────── */
.rsvp{ background: linear-gradient(180deg, var(--cream), var(--cream-hi)); }
.rsvp .d-wreath{ top: 8%; right: -4rem; width: min(20rem,48vw); opacity:.15; color: var(--moss); }
form{ margin-top:2.4rem; display:grid; gap:1.4rem; text-align:left; }
label{ font-size:.66rem; letter-spacing:.26em; text-transform:uppercase; color: var(--gold-deep); display:block; margin-bottom:.5rem; }
input, select, textarea{
  width:100%; font: inherit; font-size:1rem; color: var(--ink);
  background: transparent; border:0; border-bottom:1px solid rgba(140,163,145,.6);
  padding:.6rem .1rem; border-radius:0;
}
textarea{ resize: vertical; min-height: 4.5rem; }
input:focus, select:focus, textarea:focus{ outline:0; border-bottom-color: var(--gold); }
.two{ display:grid; gap:1.4rem; grid-template-columns: 1fr 1fr; }
@media (max-width: 30rem){ .two{ grid-template-columns:1fr; } }
.rsvp-done{ font-family: var(--display); font-size: clamp(1.8rem,6vw,2.4rem); color: var(--forest); margin-top:2rem; letter-spacing:.03em; }

/* ── Footer ──────────────────────────────────────────────────── */
footer.dark{
  padding: var(--rhythm) var(--gutter) calc(var(--rhythm) * .7);
  background: var(--deep-3);
  position: relative; overflow: hidden;
}
footer .d-sprig{ top: 2rem; left:50%; translate:-50% 0; width: 9rem; opacity:.6; color: var(--gold); }
.footer-mono{ font-family: var(--display); font-size: clamp(2.2rem,8vw,3.2rem); color: var(--ink); letter-spacing:.1em; margin-top:2.4rem; }
.footer-note{ color: var(--ink-soft); max-width: 28rem; margin: 1rem auto 0; font-size:.94rem; }

/* ── Music button ────────────────────────────────────────────── */
#music{
  position: fixed; z-index: 80;
  right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom,0px));
  width: 3rem; height: 3rem; border-radius:50%;
  border: 1px solid var(--gold); background: rgba(85,19,31,.94);
  backdrop-filter: blur(6px);
  display: none; place-items:center; color: var(--gold);
  box-shadow: 0 8px 22px -12px rgba(30,44,36,.7);
}
#music.show{ display:grid; }
#music .bars{ display:flex; gap:2px; align-items:flex-end; height:14px; }
#music .bars i{ width:2px; background: currentColor; height:5px; }
#music.playing .bars i{ animation: eq .9s ease-in-out infinite; }
#music .bars i:nth-child(2){ animation-delay:.15s } #music .bars i:nth-child(3){ animation-delay:.3s } #music .bars i:nth-child(4){ animation-delay:.45s }
@keyframes eq{ 0%,100%{ height:4px } 50%{ height:14px } }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  html{ scroll-behavior:auto; }
  .reveal{ opacity:1; transform:none; }
  #dust{ display:none; }
}

/* ── Refinements ─────────────────────────────────────────────── */
.names,.env-eyebrow,.detail-main,.count b,.dayof,.footer-mono,.env-card span,.h-script,.h-serif{ font-weight:500; }
.hero .kicker{ max-width:13rem; margin-inline:auto; font-size:.7rem; letter-spacing:.2em; line-height:1.9; }
.arch-sprig{ position:absolute; top:-1.55rem; left:50%; translate:-50% 0; width:5.5rem; color:#D4B67E; opacity:.75; }
.invite{ background: linear-gradient(180deg, var(--cream), var(--cream-hi)); }
.invite #invMessage{ color: var(--forest); }

.photo{ background: linear-gradient(180deg, var(--cream), var(--cream-hi) 50%, var(--cream)); padding-block: calc(var(--rhythm) * .9); }
.photo .d-leafL{ top:6%; left:-4rem; width:clamp(9rem,26vw,15rem); opacity:.13; rotate:-10deg; color:var(--forest); }
.photo .d-leafR{ bottom:6%; right:-4rem; width:clamp(9rem,26vw,15rem); opacity:.13; rotate:170deg; color:var(--forest); }
.photo-fig{ margin:0; display:grid; justify-items:center; gap:1.8rem; }
.photo-frame{
  position:relative; width:min(100%, 30rem); aspect-ratio:4/5; padding:.65rem;
  border:1px solid var(--gold); background: var(--beige-lo);
  border-radius: 50% 50% 0 0 / 40% 40% 0 0;
  box-shadow: 0 34px 60px -34px rgba(51,37,42,.55), 0 10px 24px -14px rgba(51,37,42,.35);
}
.photo-frame img{ width:100%; height:100%; display:block; object-fit:cover; object-position:var(--photo-pos,50% 35%); border-radius:50% 50% 0 0 / 40% 40%  0 0; }
.photo-empty{
  display:none; width:100%; height:100%; place-items:center; align-content:center; gap:.2rem; overflow:hidden;
  border-radius:50% 50% 0 0 / 40% 40% 0 0;
  background: radial-gradient(80% 60% at 50% 30%, #FAF5EB, var(--beige));
}
.photo-empty svg{ width:42%; color:var(--gold); opacity:.8; }
.photo-empty span{ font-family:var(--display); font-style:italic; font-size:clamp(1.6rem,6vw,2.3rem); color:var(--forest); }
.photo-frame.empty img{ display:none; }
.photo-frame.empty .photo-empty{ display:grid; }
.photo figcaption{ font-family:var(--display); font-style:italic; font-weight:500; font-size:clamp(1.3rem,3.6vw,1.75rem); color:var(--forest); }
.photo figcaption::before{ content:""; display:block; width:3rem; height:1px; background:var(--gold); margin:0 auto 1rem; }

@keyframes sealGlow{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.14); } }
.envelope.opening .env-flap{ animation: flapOpen 1.5s forwards; }
@keyframes flapOpen{
  0%{ transform:rotateX(0); background:var(--orn-flap) center/100% 100% no-repeat,var(--pat-env),linear-gradient(185deg,#6D2030,#55131F 70%,#45111C); animation-timing-function:cubic-bezier(.45,0,.75,.55); }
  50%{ transform:rotateX(-90deg); background:var(--orn-flap) center/100% 100% no-repeat,var(--pat-env),linear-gradient(185deg,#6D2030,#55131F 70%,#45111C); }
  50.01%{ transform:rotateX(-90deg); background:var(--pat),linear-gradient(185deg,#F3EBDD,#E6D8C0); animation-timing-function:cubic-bezier(.2,.55,.3,1); }
  100%{ transform:rotateX(-172deg); background:var(--pat),linear-gradient(185deg,#F3EBDD,#E6D8C0); }
}

#overlay{ background: var(--pat), radial-gradient(120% 90% at 50% 18%, #FAF5EC 0%, var(--cream) 48%, #E4D6BE 100%); }
#overlay::before,#overlay::after{ content:""; position:absolute; pointer-events:none; border:1px solid rgba(184,150,79,.7); }
#overlay::before{ inset:.8rem; } #overlay::after{ inset:1.15rem; border-color:rgba(184,150,79,.35); }

#overlay .d-b{ bottom:1.4rem; right:1.4rem; top:auto; left:auto; rotate:180deg; }
#overlay .d-c{ top:1.4rem; right:1.4rem; scale:-1 1; }
#overlay .d-d{ bottom:1.4rem; left:1.4rem; scale:1 -1; }
.seal{ width: clamp(4rem,15vw,5.2rem); }

.arch-sprig{ width:4rem; top:-1.9rem; opacity:.95; }
.dark:not(footer)::before{ content:""; position:absolute; inset:0; background:var(--pat-dark); pointer-events:none; }
.details .d-wave{ opacity:.4; color:var(--gold); }
.cd-section .d-arc{ animation: spin 180s linear infinite; }

.invite{ background: var(--pat), linear-gradient(180deg, var(--cream), var(--cream-hi)); }
.invite .d-leafL,.invite .d-leafR,.photo .d-leafL,.photo .d-leafR{ color:var(--gold); opacity:.32; }
.invite .narrow{
  position:relative; padding:3rem clamp(1rem,4vw,2rem); border:1px solid rgba(197,164,109,.7);
  background: var(--crn-tl) top 8px left 8px/30px no-repeat, var(--crn-tr) top 8px right 8px/30px no-repeat, var(--crn-bl) bottom 8px left 8px/30px no-repeat, var(--crn-br) bottom 8px right 8px/30px no-repeat, rgba(250,245,235,.6);

}

.photo-fig{ position:relative; padding-top:2.5rem; }
.frame-crest{ position:absolute; top:0; left:50%; translate:-50% 0; width:4.6rem; color:var(--gold); z-index:2; }
.photo-frame{

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const C = CONFIG;
  const start = new Date(C.event.startISO);
  const names = C.couple.order === "groom-first"
    ? [C.couple.groom, C.couple.bride] : [C.couple.bride, C.couple.groom];

  /* ── Dates ─────────────────────────────────────────────────── */
  const fmt = (o, l) => new Intl.DateTimeFormat(l || "en-GB", o).format(start);
  const longDate = fmt({ weekday:"long", day:"numeric", month:"long", year:"numeric" });
  const shortDate = fmt({ day:"numeric", month:"long", year:"numeric" });

  function hijri(){
    if (C.event.hijri && C.event.hijri !== "auto") return C.event.hijri;
    try{
      const loc = (C.event.hijriLocale === "ar" ? "ar-SA" : "en") + "-u-ca-islamic-umalqura";
      return new Intl.DateTimeFormat(loc, { day:"numeric", month:"long", year:"numeric" }).format(start);
    }catch(e){ return ""; }
  }

  /* ── Envelope screen ───────────────────────────────────────── */
  $("#envEyebrow").textContent = C.envelope.eyebrow;
  $("#envTo").textContent = C.envelope.addressedTo;
  $("#envHint").textContent = C.envelope.action;
  const sealEl = $("#seal");
  function fitSeal(){
    const txt = C.couple.monogram, fam = getComputedStyle(sealEl).fontFamily;
    const cx = document.createElement("canvas").getContext("2d");
    cx.font = `100px ${fam}`; cx.textAlign = "left"; cx.textBaseline = "alphabetic";
    const m = cx.measureText(txt), L = m.actualBoundingBoxLeft, Rt = m.actualBoundingBoxRight, A = m.actualBoundingBoxAscent, D = m.actualBoundingBoxDescent;
    const fs = Math.min(46, 62 * 100 / Math.hypot(L + Rt, A + D)), k = fs / 100;
    const x = 50 - k * (Rt - L) / 2, y = 50 - k * (D - A) / 2;
    sealEl.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true"><text x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="${fs.toFixed(2)}"></text></svg>`;
    sealEl.querySelector("text").textContent = txt;
  }
  fitSeal();
  if (document.fonts){ document.fonts.load("100px " + getComputedStyle(sealEl).fontFamily, C.couple.monogram).then(fitSeal); document.fonts.ready.then(fitSeal); }
  $("#envCardNames").textContent = names.join(" & ");
  $("#envCardDate").textContent = fmt({ day:"2-digit", month:"2-digit", year:"numeric" }).replace(/\//g, " . ");

  const overlay = $("#overlay"), env = $("#envelope"), site = $("#site");
  let opened = false;

  function openEnvelope(){
    if (opened) return; opened = true;
    env.setAttribute("aria-label", "Opening");
    env.classList.add("opening");
    setTimeout(() => env.classList.add("lift"), 1300);
    setTimeout(() => env.classList.add("bloom"), 2800);
    setTimeout(() => {
      overlay.classList.add("gone");
      site.hidden = false;
      document.body.classList.remove("locked");
      revealAll();
      setTimeout(() => overlay.remove(), 1500);
    }, 3300);
  }
  env.addEventListener("click", openEnvelope);

  /* ── Content ───────────────────────────────────────────────── */
  $("#heroFamilies").textContent = C.invitation.families;
  $("#heroNames").innerHTML = `${names[0]}<span class="amp">&amp;</span>${names[1]}`;
  $("#heroDate").textContent = shortDate;

  (() => {
    const P = C.photo || {}, frame = $("#photoFrame"), img = $("#photoImg");
    frame.style.setProperty("--photo-pos", P.position || "50% 35%");
    $("#photoCaption").textContent = P.caption || "";
    $("#photoMono").textContent = `${names[0][0]} & ${names[1][0]}`;
    img.alt = P.alt || "";
    img.addEventListener("error", () => frame.classList.add("empty"));
    if (P.src) img.src = P.src; else frame.classList.add("empty");
  })();

  $("#invMessage").textContent = `${names[0]} and ${names[1]} ${C.invitation.message}`;
  if (C.invitation.verse){
    $("#verseBlock").hidden = false;
    $("#verseText").textContent = C.invitation.verse;
    $("#verseSource").textContent = C.invitation.verseSource;
  }

  $("#dDate").textContent = longDate;
  $("#dHijri").textContent = hijri();
  $("#dTime").textContent = C.event.timeLabel || fmt({ hour:"numeric", minute:"2-digit" });
  $("#dTimeSub").textContent = C.event.timeSub || "";
  $("#dVenue").textContent = C.event.venue.name;
  $("#dCity").textContent = C.event.venue.city;

  if ($("#vName")) $("#vName").textContent = C.event.venue.name;
  if ($("#vAddr")) $("#vAddr").textContent = `${C.event.venue.address} · ${C.event.venue.city}`;
  if ($("#vNote")) $("#vNote").textContent = C.event.venue.note || "";

  $("#mapsBtn").href = C.event.venue.mapsUrl;
  if ($("#mapsBtn2")) $("#mapsBtn2").href = C.event.venue.mapsUrl;

  $("#footMono").textContent = `${names[0]} & ${names[1]}`;
  $("#footNote").textContent = C.closing;

  /* ── Google Calendar ───────────────────────────────────────── */
  (() => {
    const end = new Date(start.getTime() + (C.event.durationHours || 4) * 36e5);
    const z = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
    const p = new URLSearchParams({
      action: "TEMPLATE",
      text: `Wedding of ${names[0]} & ${names[1]}`,
      dates: `${z(start)}/${z(end)}`,
      details: `${C.invitation.families} — we would love to celebrate with you.`,
      location: `${C.event.venue.name}, ${C.event.venue.address}, ${C.event.venue.city}`
    });
    $("#calBtn").href = "https://calendar.google.com/calendar/render?" + p.toString();
  })();

  /* ── Countdown ─────────────────────────────────────────────── */
  $("#cdHeading").textContent = C.countdown.heading;
  const pad = n => String(n).padStart(2, "0");
  function tick(){
    const diff = start - Date.now();
    if (diff <= 0){
      $("#countdown").hidden = true;
      const d = $("#dayOf"); d.hidden = false; d.textContent = C.countdown.dayOfMessage;
      clearInterval(timer); return;
    }
    const s = Math.floor(diff / 1000);
    $("#cdD").textContent = Math.floor(s / 86400);
    $("#cdH").textContent = pad(Math.floor(s / 3600) % 24);
    $("#cdM").textContent = pad(Math.floor(s / 60) % 60);
    $("#cdS").textContent = pad(s % 60);
  }
  const timer = setInterval(tick, 1000); tick();

  /* ── Story ─────────────────────────────────────────────────── */
  if (C.story && C.story.length && $("#storySection")){
    $("#storySection").hidden = false;
    $("#timeline").innerHTML = C.story.map(s => `
      <div class="tl-item">
        <p class="tl-when">${s.when}</p>
        <h3 class="tl-title">${s.title}</h3>
        <p>${s.text}</p>
      </div>`).join("");
  }

  /* ── Gallery ───────────────────────────────────────────────── */
  const placeholder = (i, cap) => {
    const tints = ["#E7E0D1","#DDE2D8","#EFE9DC","#D6DED5","#EAE2D2","#E2E7DE"];
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
      <rect width="300" height="400" fill="${tints[i % tints.length]}"/>
      <g fill="none" stroke="#47604F" stroke-width="1.1" opacity=".55" stroke-linecap="round"
         transform="translate(150 196)">
        <path d="M0-56v112"/>
        <path d="M0-34c-12-11-30-10-38 2 12 10 30 9 38-2ZM0-34c12-11 30-10 38 2-12 10-30 9-38-2Z"/>
        <path d="M0-8c-11-10-27-9-34 2 11 9 27 8 34-2ZM0-8c11-10 27-9 34 2-11 9-27 8-34-2Z"/>
        <path d="M0 18c-9-8-23-8-29 2 9 8 23 7 29-2ZM0 18c9-8 23-8 29 2-9 8-23 7-29-2Z"/>
      </g>
      <circle cx="150" cy="140" r="3" fill="#BFA06A"/>
      <text x="150" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
            font-size="11" fill="#47604F" letter-spacing="2.4">${String(cap || "").slice(0,26)}</text>
    </svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  };

  const shots = (C.gallery || []).map((g, i) => ({ src: g.src || placeholder(i, g.caption), caption: g.caption || "" }));
  if (shots.length && $("#gallerySection")){
    $("#gallerySection").hidden = false;
    $("#gallery").innerHTML = shots.map((g, i) => `
      <button type="button" data-i="${i}" aria-label="View photo ${i+1}">
        <img src="${g.src}" alt="${g.caption}" loading="lazy" decoding="async">
        <figcaption>${g.caption}</figcaption>
      </button>`).join("");
  }

  /* ── Lightbox ──────────────────────────────────────────────── */
  const lb = $("#lightbox"), lbImg = $("#lbImg"), lbCap = $("#lbCap");
  let idx = 0;
  const show = i => {
    idx = (i + shots.length) % shots.length;
    lbImg.src = shots[idx].src; lbImg.alt = shots[idx].caption; lbCap.textContent = shots[idx].caption;
  };
  const closeLb = () => { lb.classList.remove("on"); document.body.classList.remove("locked"); };
  $("#gallery")?.addEventListener("click", e => {
    const b = e.target.closest("button[data-i]"); if (!b) return;
    show(+b.dataset.i); lb.classList.add("on"); document.body.classList.add("locked");
  });
  lb.querySelector(".lb-close").addEventListener("click", closeLb);
  lb.querySelector(".lb-prev").addEventListener("click", () => show(idx - 1));
  lb.querySelector(".lb-next").addEventListener("click", () => show(idx + 1));
  lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("on")) return;
    if (e.key === "Escape") closeLb();
    if (e.key === "ArrowLeft") show(idx - 1);
    if (e.key === "ArrowRight") show(idx + 1);
  });
  let tx = 0;
  lb.addEventListener("touchstart", e => tx = e.changedTouches[0].clientX, { passive:true });
  lb.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) show(idx + (dx < 0 ? 1 : -1));
  }, { passive:true });

  /* ── Dress code ────────────────────────────────────────────── */
  if (C.dressCode && C.dressCode.enabled && $("#dressSection")){
    $("#dressSection").hidden = false;
    $("#dressTitle").textContent = C.dressCode.title;
    $("#dressText").textContent = C.dressCode.text;
    $("#swatches").innerHTML = (C.dressCode.palette || []).map(c => `<i style="background:${c}"></i>`).join("");
  }

  /* ── RSVP ──────────────────────────────────────────────────── */
  if (C.rsvp && C.rsvp.enabled && $("#rsvpSection")){
    $("#rsvpSection").hidden = false;
    $("#rsvpDeadline").textContent = C.rsvp.deadline || "";
    const done = $("#rsvpDone"), form = $("#rsvpForm"), err = $("#rsvpError");

    const finish = who => {
      form.hidden = true; done.hidden = false;
      done.textContent = `Thank you${who ? ", " + who : ""} — your reply is on its way`;
    };
    try{ const prev = localStorage.getItem("rsvp-name"); if (prev) finish(prev); }catch(e){}

    form.addEventListener("submit", e => {
      e.preventDefault();
      const name = $("#rName").value.trim();
      if (!name){ err.hidden = false; err.textContent = "Please add your name so we know who’s coming."; $("#rName").focus(); return; }
      err.hidden = true;

      const body = [
        `RSVP — wedding of ${names[0]} & ${names[1]}`,
        `Name: ${name}`,
        `Attending: ${$("#rAttend").value}`,
        `Guests: ${$("#rGuests").value}`,
        $("#rNote").value.trim() ? `Note: ${$("#rNote").value.trim()}` : ""
      ].filter(Boolean).join("\n");

      const url = C.rsvp.method === "email"
        ? `mailto:${C.rsvp.email}?subject=${encodeURIComponent("RSVP — " + name)}&body=${encodeURIComponent(body)}`
        : `https://wa.me/${C.rsvp.whatsapp}?text=${encodeURIComponent(body)}`;

      window.open(url, "_blank", "noopener");
      try{ localStorage.setItem("rsvp-name", name); }catch(e){}
      finish(name);
    });
  }

  /* ── Music ─────────────────────────────────────────────────── */
  if (C.music && C.music.src){
    const btn = $("#music"), audio = $("#audio");
    audio.src = C.music.src; audio.volume = 0.45;
    btn.classList.add("show"); btn.setAttribute("aria-label", C.music.title || "Play music");
    btn.addEventListener("click", () => {
      if (audio.paused){ audio.play().then(() => { btn.classList.add("playing"); btn.setAttribute("aria-pressed","true"); }).catch(()=>{}); }
      else { audio.pause(); btn.classList.remove("playing"); btn.setAttribute("aria-pressed","false"); }
    });
  }

  /* ── Reveals + parallax ────────────────────────────────────── */
  const io = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.12, rootMargin: "0px 0px -8%" });
  function revealAll(){ document.querySelectorAll(".reveal").forEach(el => io.observe(el)); }

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduced){
    const tl = document.querySelector(".hero-corner.tl"), br = document.querySelector(".hero-corner.br");
    let ticking = false;
    addEventListener("scroll", () => {
      if (ticking) return; ticking = true;
      requestAnimationFrame(() => {
        const y = scrollY;
        if (y < innerHeight * 1.2){
          tl.style.transform = `translateY(${y * 0.12}px)`;
          br.style.transform = `translateY(${y * 0.08}px)`;
        }
        ticking = false;
      });
    }, { passive:true });
  }

  /* ── Drifting particles ────────────────────────────────────── */
  if (!reduced){
    const cv = $("#dust"), ctx = cv.getContext("2d");
    let w, h, dots;
    const tints = ["197,164,109", "197,164,109", "100,31,50"];
    const sizeUp = () => {
      w = cv.width = innerWidth; h = cv.height = innerHeight;
      dots = Array.from({ length: Math.min(34, Math.round(w / 38)) }, () => ({
        x: Math.random()*w, y: Math.random()*h,
        r: Math.random()*1.5 + 0.5,
        vy: -(Math.random()*0.2 + 0.05),
        vx: (Math.random()-0.5)*0.12,
        a: Math.random()*0.4 + 0.12,
        c: tints[Math.floor(Math.random()*tints.length)]
      }));
    };
    sizeUp(); addEventListener("resize", sizeUp);
    (function loop(){
      ctx.clearRect(0,0,w,h);
      for (const d of dots){
        d.y += d.vy; d.x += d.vx;
        if (d.y < -6){ d.y = h + 6; d.x = Math.random()*w; }
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283);
        ctx.fillStyle = `rgba(${d.c},${d.a})`; ctx.fill();
      }
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
